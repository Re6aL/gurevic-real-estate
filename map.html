  <style>
    /* ---- страница карты (минимализм в духе findrealestate) ---- */
    .map-toolbar {
      position: relative; z-index: 2;
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      padding: 12px 22px; background: #fff; border-bottom: 1px solid var(--line);
    }
    .view-toggle { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
    .view-toggle button {
      padding: 9px 20px; border: none; background: #fff; color: var(--muted);
      font-family: var(--font-display); font-size: .85rem; letter-spacing: .08em; text-transform: uppercase;
    }
    .view-toggle button.active { background: var(--navy); color: #fff; }
    .map-deal-tabs { display: flex; gap: 6px; }
    .map-deal-tabs .deal-tab { padding: 8px 16px; font-size: .85rem; }
    .map-count { margin-left: auto; color: var(--muted); font-size: .88rem; }

    .map-wrap {
      position: relative; z-index: 0; isolation: isolate;
      display: grid; grid-template-columns: 400px 1fr; height: calc(100vh - 84px - 59px);
    }
    .map-list { overflow-y: auto; border-right: 1px solid var(--line); background: var(--bg-soft); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    #map { height: 100%; }

    /* мини-карточка в панели */
    .mini-card {
      display: grid; grid-template-columns: 108px 1fr; gap: 12px;
      min-height: 102px;
      background: #fff; border: 1px solid var(--line); border-radius: 12px;
      overflow: hidden; cursor: pointer; transition: box-shadow .15s, border-color .15s;
    }
    .mini-card:hover, .mini-card.hot { border-color: var(--gold); box-shadow: var(--shadow); }
    .mini-card .ph, .mini-card .listing-image { aspect-ratio: auto; height: 100%; min-height: 84px; font-size: .58rem; }
    .mini-card .mc-body { padding: 9px 10px 9px 0; min-width: 0; }
    .mini-card .mc-price { font-weight: 700; color: var(--navy); font-size: .98rem; }
    .mini-card .mc-title { font-size: .82rem; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-card .mc-loc { font-size: .76rem; color: var(--muted); }
    .mini-card .mc-params { font-size: .74rem; color: var(--muted); margin-top: 2px; }

    /* маркер-ценник на карте */
    .price-pin {
      background: var(--navy); color: #fff; font: 700 .78rem var(--font-body);
      padding: 4px 10px; border-radius: 999px; white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,.35); border: 1.5px solid #fff;
      transform: translate(-50%, -50%); display: inline-block; cursor: pointer;
    }
    .price-pin.invest { background: var(--gold); color: var(--navy); }
    .leaflet-marker-icon:hover .price-pin, .price-pin.hot { background: var(--gold-dark); color: #fff; }
    .leaflet-popup-content { margin: 10px 12px; font-family: var(--font-body); }
    .leaflet-popup-content a { color: var(--gold-dark); font-weight: 700; }

    /* режим «Список» */
    .list-view { padding: 22px; max-width: 1180px; margin: 0 auto; }

    @media (max-width: 900px) {
      .map-wrap { grid-template-columns: 1fr; }
      .map-list { display: none; }  /* на мобиле список доступен через переключатель */
    }
  </style>
